services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - todo-pg:/var/lib/postgresql
      - ./server/docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./server
      target: runtime
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://todo:todo@postgres:5432/todo
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 20

  web:
    build: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  tests:
    profiles: ["test"]
    build:
      context: ./server
      target: test
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://todo:todo@postgres:5432/todo_test
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  todo-pg:
